[package]
name = "stimmwerk-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "stimmwerk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
stimmwerk-core.workspace = true
funkhaus-sys.workspace = true
funkhaus-llm.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
funkhaus-llm = { workspace = true, features = ["testsrv"] }
