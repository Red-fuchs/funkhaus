[package]
name = "stimmwerk-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
toml_edit = "0.22"
sha1 = "0.10"
indexmap = { version = "2", features = ["serde"] }
funkhaus-sys.workspace = true
funkhaus-audio.workspace = true
funkhaus-voice.workspace = true
funkhaus-llm.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
tempfile = "3"
funkhaus-llm = { workspace = true, features = ["testsrv"] }
